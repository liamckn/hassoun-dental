name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build site
        working-directory: artifacts/hassoun-dental
        env:
          PORT: "3000"
          BASE_PATH: "/"
          NODE_ENV: production
        run: pnpm run build

      - name: SPA routes (one index.html per page so each URL returns HTTP 200) + 404.html
        working-directory: artifacts/hassoun-dental/dist/public
        run: |
          for r in implant-dentaire-marseille parodontite-marseille urgence-dentaire-marseille dentiste-enfant-marseille gencives-qui-saignent-marseille; do
            mkdir -p "$r" && cp index.html "$r/index.html"
          done
          cp index.html 404.html

      - name: Add .nojekyll
        run: touch artifacts/hassoun-dental/dist/public/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/hassoun-dental/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
