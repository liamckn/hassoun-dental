kind = "web"
previewPath = "/"
title = "Dr. Stéphanie Hassoun — Cabinet Dentaire Marseille"
version = "1.0.0"
id = "artifacts/hassoun-dental"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19664

[services.development]
run = "pnpm --filter @workspace/hassoun-dental run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hassoun-dental", "run", "build" ]
publicDir = "artifacts/hassoun-dental/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19664"
BASE_PATH = "/"
